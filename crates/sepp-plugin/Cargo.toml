[package]
name = "sepp-plugin"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Guest-SDK für WASM-Plugins von sepp mini (Tier 2): eine Funktion statt eines Protokolls"

[features]
default = []
# Schaltet `Host::fs()` UND den Import `host_fs_read_bytes` frei. Nur setzen, wenn das Manifest
# `fs_read` (oder `fs_write`) anfordert — sonst importiert das Modul eine Funktion, die der Host
# ohne Gewährung nicht registriert, und lädt nicht.
fs-read = []
# Schaltet `Host::http()` UND den Import `host_http` frei (Gate `net`). Der Host prüft je Anfrage
# die Host-Allowlist, setzt Secrets ($NAME in Header-Werten) an der Grenze ein und schreibt jede
# Anfrage in die Audit-Spur. base64 nur hier — ein Plugin ohne Netz wächst nicht.
net = ["dep:base64"]

[dependencies]
sepp-core = { path = "../sepp-core", features = ["schema"] }
sepp-plugin-macros = { path = "../sepp-plugin-macros" }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
base64 = { workspace = true, optional = true }
