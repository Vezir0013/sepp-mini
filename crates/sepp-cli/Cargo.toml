[package]
name = "sepp-cli"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "sepp mini — CLI (Phase 1: One-shot)"

[[bin]]
name = "sepp"
path = "src/main.rs"

[features]
default = []
# Optionales SQLite-Session-Backend (für `-p`/`--rpc` via `--sqlite`).
sqlite = ["sepp-session/sqlite"]

[dependencies]
sepp-core = { path = "../sepp-core" }
sepp-provider = { path = "../sepp-provider", features = [
    "anthropic",
    "openai",
    "zai",
    "moonshot",
] }
sepp-tools = { path = "../sepp-tools" }
sepp-policy = { path = "../sepp-policy" }
sepp-agent = { path = "../sepp-agent" }
sepp-session = { path = "../sepp-session" }
sepp-hooks = { path = "../sepp-hooks" }
sepp-mcp = { path = "../sepp-mcp" }
sepp-wasm = { path = "../sepp-wasm" }
sepp-pkg = { path = "../sepp-pkg" }

serde_json = { workspace = true }
# `sepp pkg install <name>` / `search`: Index und Paket per HTTPS holen (eigene Runtime, pkg_fetch.rs)
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = "=5.0.1"
toml = "=0.8.23"      # `sepp pkg pack` liest Name/Version; Tests prüfen Vorlagen
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["event-stream"] }

[dev-dependencies]
tempfile = { workspace = true }
