[package]
name = "sepp-policy"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Capabilities, Policy-Auswertung und OS-Sandbox für sepp mini (Phase 4)"

[dependencies]
sepp-core = { path = "../sepp-core" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = "=0.8.23"
toml_edit = "=0.22.27"
# Host-Bestimmung in `url_host` — derselbe Parser wie der HTTP-Client (reqwest zieht `url`),
# damit Policy und Verbindung nie zwei verschiedene Hosts sehen.
url = "=2.5.8"
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.5"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
