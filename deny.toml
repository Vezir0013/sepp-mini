# cargo-deny: Supply-Chain-Gate (Lizenzen + bekannte Vulns + Quellen).
# Lauf: `cargo deny check`  (oder `just audit`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Beide Felder ausdrücklich setzen: cargo-deny hat den Default für `unsound` auf "workspace"
# geändert (nur direkte Workspace-Deps schlagen an) — damit blieben zwei lru-Advisories, die
# transitiv über ratatui hereinkommen, in CI stumm. Ein Gate, das transitive Befunde nicht
# meldet, sagt nichts aus: hier gilt "all", jede Kette zählt.
unmaintained = "all"
unsound = "all"
ignore = [
    # paste: unmaintained (kein Code-Defekt, kein sicheres Upgrade); nur transitiv via ratatui (TUI).
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, kein Code-Defekt; transitiv via ratatui" },
    # smartstring: unmaintained seit 2026-05 (Repo archiviert; kein Code-Defekt, kein sicheres
    # Upgrade); nur transitiv via rhai (Hooks). Beobachten, ob rhai auf compact_str/smol_str wechselt.
    { id = "RUSTSEC-2026-0249", reason = "smartstring unmaintained, Repo archiviert; transitiv via rhai" },
    # lru 0.12.5, zwei unsound-Befunde, transitiv via ratatui 0.29 (Layout-Cache). Beide brauchen
    # Code, den ratatui nicht ausführt: von `LruCache` benutzt `layout::Layout` nur `get_or_insert`,
    # `resize` und `cap`. `IterMut` kommt nicht vor (0002), `pop()` auch nicht (0253 — `resize`
    # verdrängt über `pop_lru`), und der Schlüssel `(Rect, Layout)` hat kein Drop, das panicken
    # kann; die Kette Panik-im-Drop → `catch_unwind` → Verdrängung ist damit nicht bildbar.
    # Behebbar erst mit lru >= 0.18.2, das ratatui-core ab 0.30 zieht — ein Update der TUI-
    # Bibliothek gehört in einen eigenen Schritt, nicht in ein Supply-Chain-Gate. Fällt es,
    # meldet cargo-deny diese Einträge selbst als `advisory-not-detected`.
    { id = "RUSTSEC-2026-0002", reason = "lru::IterMut wird von ratatui nicht benutzt (nur get_or_insert/resize/cap)" },
    { id = "RUSTSEC-2026-0253", reason = "LruCache::pop wird nicht aufgerufen (resize nutzt pop_lru); Schlüssel (Rect, Layout) ohne panickendes Drop" },
]

[licenses]
version = 2
# Permissive Lizenzen, die für eine verteilbare Binary unproblematisch sind.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (TLS-Wurzelzertifikate), permissiv
    # Eigene Projektlizenz der sepp-*-Crates (source-available, nicht-kommerziell) —
    # KEINE permissive Dependency-Lizenz, sondern unsere eigene; cargo-deny prüft auch
    # die Workspace-Member gegen diese Allowlist.
    "PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Crates.io-Deps sind exakt gepinnt (`=x.y.z`). `wildcards` würde sonst die internen
# Pfad-Deps (`sepp-*`) fälschlich anschlagen (cargo-deny wendet allow-wildcard-paths nicht
# auf „public" Crates an) → daher "warn".
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
