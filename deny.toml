# cargo-deny: Supply-Chain-Gate (Lizenzen + bekannte Vulns + Quellen).
# Lauf: `cargo deny check`  (oder `just audit`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Beide Felder ausdrücklich setzen: cargo-deny hat den Default für `unsound` auf "workspace"
# geändert (nur direkte Workspace-Deps schlagen an) — damit blieben zwei lru-Advisories, die
# transitiv über ratatui hereinkamen, in CI stumm. Ein Gate, das transitive Befunde nicht
# meldet, sagt nichts aus: hier gilt "all", jede Kette zählt.
unmaintained = "all"
unsound = "all"
ignore = [
    # smartstring: unmaintained seit 2026-05 (Repo archiviert; kein Code-Defekt, kein sicheres
    # Upgrade); nur transitiv via rhai (Hooks). Beobachten, ob rhai auf compact_str/smol_str wechselt.
    # Einziger verbliebener Ignore — jeder weitere braucht denselben Grund: bewertet, nicht
    # weggewischt, und mit `reason`, damit die Ausgabe des Gates ihn nennt und nicht nur die Datei.
    { id = "RUSTSEC-2026-0249", reason = "smartstring unmaintained, Repo archiviert; transitiv via rhai" },
]

[licenses]
version = 2
# Permissive Lizenzen, die für eine verteilbare Binary unproblematisch sind.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (TLS-Wurzelzertifikate), permissiv
    # Eigene Projektlizenz der sepp-*-Crates (source-available, nicht-kommerziell) —
    # KEINE permissive Dependency-Lizenz, sondern unsere eigene; cargo-deny prüft auch
    # die Workspace-Member gegen diese Allowlist.
    "PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Crates.io-Deps sind exakt gepinnt (`=x.y.z`). `wildcards` würde sonst die internen
# Pfad-Deps (`sepp-*`) fälschlich anschlagen (cargo-deny wendet allow-wildcard-paths nicht
# auf „public" Crates an) → daher "warn".
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
